[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careerflow-agent-skill"
version = "0.2.0"
description = "A portable agent skill for evidence-based career and job application workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Bin Liu"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]

[project.optional-dependencies]
pdf = ["reportlab>=3.6,<5"]

[project.scripts]
careerflow = "careerflow.__main__:main"

[project.urls]
Repository = "https://github.com/liubinby/careerflow-agent-skill"
Issues = "https://github.com/liubinby/careerflow-agent-skill/issues"

[tool.setuptools]
packages = ["careerflow"]

[tool.setuptools.package-data]
careerflow = ["assets/*.json", "assets/*.html"]
